services:
  yoast_analysis.route_subscriber:
    class: Drupal\yoast_analysis\Routing\RouteSubscriber
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }
  yoast_analysis.text_extractor:
    class: Drupal\yoast_analysis\TextExtractor
    arguments:
      - '@entity_type.manager'
      - '@renderer'
      - '@service_container'
  yoast_analysis.access_check:
    class: Drupal\yoast_analysis\Access\AnalysisAccessCheck
    arguments:
      - '@entity_display.repository'
    tags:
      - { name: access_check, applies_to: _yoast_analysis_access }
