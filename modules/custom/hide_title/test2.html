<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Grid Example</title>
<style>
@import url('https://fonts.googleapis.com/css?family=Cardo:400i|Rubik:400,700&display=swap');

body {
  margin: 0;
  font-family: 'Rubik', sans-serif;
  background: #f5f5f5;
  display: grid;
  place-items: center;
  min-height: 100vh;
}

.page-content {
  display: grid;
  gap: 1rem;
  padding: 1rem;
  max-width: 1024px;
  width: 100%;
  grid-template-columns: 1fr;
}

@media (min-width: 600px) {
  .page-content { grid-template-columns: repeat(2, 1fr); }
}

@media (min-width: 800px) {
  .page-content { grid-template-columns: repeat(4, 1fr); }
}

.card {
  position: relative;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  height: 350px;
  color: white;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.3s ease;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.card::before {
  content: '';
  position: absolute;
  top:0; left:0; right:0; bottom:0;
  background-size: cover;
  background-position: center;
  z-index: 0;
  transition: transform 0.7s cubic-bezier(0.19,1,0.22,1);
}

.card::after {
  content: '';
  position: absolute;
  top:0; left:0; right:0; bottom:0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.7));
  z-index: 0;
  transition: transform 0.7s cubic-bezier(0.19,1,0.22,1);
}

.card .content {
  position: relative;
  z-index: 1;
  padding: 1rem;
  transition: transform 0.7s cubic-bezier(0.19,1,0.22,1);
}

.card .title {
  font-size: 1.3rem;
  font-weight: bold;
  margin: 0;
}

.card .copy {
  font-family: 'Cardo', serif;
  font-size: 1.1rem;
  font-style: italic;
  margin: 0.5rem 0;
}

.card .btn {
  margin-top: 1rem;
  padding: 0.5rem 1rem;
  font-size: 0.8rem;
  font-weight: bold;
  text-transform: uppercase;
  background: black;
  color: white;
  border: none;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-5px);
}

.card:hover::before {
  transform: scale(1.1);
}

.card:hover .content {
  transform: translateY(-10px);
}
</style>
</head>
<body>

<main class="page-content">
  <!-- Cards will be generated by JS -->
</main>

<script>
const cards = [
  { title: 'Mountain View', copy: 'Check out all of these gorgeous mountain trips...', button: 'View Trips', image: 'https://images.unsplash.com/photo-1517021897933-0e0319cfbc28?auto=format&fit=crop&w=400&q=80' },
  { title: 'To The Beach', copy: 'Plan your next beach trip with these fabulous destinations', button: 'View Trips', image: 'https://images.unsplash.com/photo-1533903345306-15d1c30952de?auto=format&fit=crop&w=400&q=80' },
  { title: 'Desert Destinations', copy: "It's the desert you've always dreamed of", button: 'Book Now', image: 'https://images.unsplash.com/photo-1545243424-0ce743321e11?auto=format&fit=crop&w=400&q=80' },
  { title: 'Explore The Galaxy', copy: 'Seriously, straight up, just blast off into outer space today', button: 'Book Now', image: 'https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?auto=format&fit=crop&w=400&q=80' }
];

const container = document.querySelector('.page-content');

cards.forEach(card => {
  const cardElem = document.createElement('div');
  cardElem.className = 'card';
  cardElem.style.setProperty('--image', `url(${card.image})`);
  cardElem.innerHTML = `
    <div class="content">
      <h2 class="title">${card.title}</h2>
      <p class="copy">${card.copy}</p>
      <button class="btn">${card.button}</button>
    </div>
  `;
  cardElem.style.backgroundImage = `url(${card.image})`;
  cardElem.querySelector('::before');
  cardElem.style.setProperty('--bg', `url(${card.image})`);
  cardElem.style.setProperty('--before-image', `url(${card.image})`);
  container.appendChild(cardElem);
});

// Set each card's ::before background via JS
document.querySelectorAll('.card').forEach((card, i) => {
  card.style.setProperty('--before-image', `url(${cards[i].image})`);
  card.querySelector('::before'); // fallback
});
</script>

</body>
</html>
