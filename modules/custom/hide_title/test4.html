<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoSwipe Single Example</title>
  <!-- PhotoSwipe CSS -->
  <link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css">
  <style>
    body { font-family: sans-serif; }
    .pswp-gallery img { width: 150px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>

<h1>PhotoSwipe Example</h1>

<div class="pswp-gallery" id="my-gallery">
  <a href="https://cdn.photoswipe.com/photoswipe-demo-images/photos/2/img-2500.jpg"
     data-pswp-width="1669"
     data-pswp-height="2500">
    <img src="https://cdn.photoswipe.com/photoswipe-demo-images/photos/2/img-200.jpg" alt="Image 1">
  </a>
  <a href="https://cdn.photoswipe.com/photoswipe-demo-images/photos/3/img-2500.jpg"
     data-pswp-width="2500"
     data-pswp-height="1666">
    <img src="https://cdn.photoswipe.com/photoswipe-demo-images/photos/3/img-200.jpg" alt="Image 2">
  </a>
  <a href="https://cdn.photoswipe.com/photoswipe-demo-images/photos/7/img-2500.jpg"
     data-pswp-width="1875"
     data-pswp-height="2500"
     data-cropped="true">
    <img src="https://cdn.photoswipe.com/photoswipe-demo-images/photos/7/img-200.jpg" alt="Cropped Image">
  </a>
</div>

<!-- PhotoSwipe JS -->
<script type="module">
  import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.js';

  const lightbox = new PhotoSwipeLightbox({
    gallery: '#my-gallery',
    children: 'a',
    pswpModule: () => import('https://unpkg.com/photoswipe@5/dist/photoswipe.esm.js')
  });

  lightbox.init();
</script>

</body>
</html>
