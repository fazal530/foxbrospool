<div class="pool-card">
  <div class="title">
    <h3>{{ title }}</h3>
  </div>
  <div class="image">
    {{ field_gallery_image }}
  </div>
  <div class="brand">
    {{ field_brand }}
  </div>
  <div class="properties">
    {{ field_properties }}
  </div>
  <div class="button-action">
    <div class="price">
      {{ field_package_price }}
    </div>
    <div class="order-btn">
      <span>Order Now</span>
    </div>
  </div>
</div>
<div class="description">
    {{ body }}
  </div>
